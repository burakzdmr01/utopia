{% extends 'base.html' %}

{% block title %}Sign Up — Utopia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-4 text-center">Create Account</h3>
		{% if error %}
		<div class="alert alert-danger">{{ error }}</div>
		{% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">Sign Up</button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0">
                    Already have an account? <a href="/users/login/" class="text-dark fw-bold">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
