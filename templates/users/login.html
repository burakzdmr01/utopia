{% extends 'base.html' %}

{% block title %}Login — Utopia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-4 text-center">Welcome Back</h3>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger p-2 text-center small mb-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">Login</button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0">
                    Don't have an account? <a href="/users/signup/" class="text-dark fw-bold">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
